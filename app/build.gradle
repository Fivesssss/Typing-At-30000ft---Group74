plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

//ONLY WAY WE FIGURED OUT HOW TO GT THE GAME IN A JAR FILE
jar {
    manifest {
        attributes 'Main-Class': 'org.example.airplanegame.Launcher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    //PHYSICS DEPENDENCIES
    // Source: https://mvnrepository.com/artifact/org.dyn4j/dyn4j
    implementation group: 'org.dyn4j', name: 'dyn4j', version: '5.0.2'

    //JSON PARSER
    // Source: https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.13.2'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

//for javafx
javafx {
    version = '25.0.2'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.media']
}

application {
    // Define the main class for the application.
    //CHANGE IF MAIN CLASS CHANGES
    mainClass = 'org.example.airplanegame.Launcher'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}